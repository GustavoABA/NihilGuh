name: Validate site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check games.js
          node --check goals-api.js
          node --check site.config.js
          node --check starting/starting.js
          node --check tiktok/player.js
      - name: Check Apps Script JavaScript syntax
        run: |
          cat apps-script/Code.gs apps-script/Interactions.gs apps-script/RoundEngine.gs > /tmp/backend.js
          node --check /tmp/backend.js
      - name: Check ALL_IN_ONE sync
        run: |
          python -c 'from pathlib import Path; h="/**\n * NIHILGUH — ALL IN ONE\n * Gerado de Code.gs + Interactions.gs + RoundEngine.gs.\n * Cole este arquivo inteiro no projeto Apps Script do site.\n */\n\n"; e=h+Path("apps-script/Code.gs").read_text()+"\n\n"+Path("apps-script/Interactions.gs").read_text()+"\n\n"+Path("apps-script/RoundEngine.gs").read_text()+"\n"; a=Path("apps-script/ALL_IN_ONE.gs").read_text(); assert a==e, "ALL_IN_ONE.gs is out of sync with source files"'
      - name: Check starting page document shell
        run: |
          grep -qi '^<!doctype html>' starting/index.html
          grep -q '<head>' starting/index.html
          grep -q 'href="starting.css?v=' starting/index.html
          grep -q '<main class="broadcast" id="broadcast">' starting/index.html
          grep -q '</html>' starting/index.html
      - name: Check required routes
        run: |
          test -f index.html
          test -f live/index.html
          test -f play/index.html
          test -f overlay/index.html
          test -f overlay.html
          test -f starting/index.html
          test -f tiktok/index.html
          test -f tiktok/player.js
          test -f starting/starting.css
          test -f starting/starting.js
          test -f assets/audio/harpy-hare.mp3
          test $(wc -c < assets/audio/harpy-hare.mp3) -gt 1000000
          test -f apps-script/ALL_IN_ONE.gs
      - name: Smoke-test deployed Apps Script
        run: |
          URL=$(python - <<'PY'
          import re
          text=open("site.config.js",encoding="utf-8").read()
          m=re.search(r"DEFAULT_BACKEND = '([^']+)'", text)
          assert m, "DEFAULT_BACKEND not found"
          print(m.group(1))
          PY
          )
          echo "Testing $URL"
          CODE=$(curl -L -sS -o /tmp/apps-script-smoke -w "%{http_code}" --max-time 45 "$URL?action=stateLite&callback=smokeTest" || true)
          echo "HTTP=$CODE"
          head -c 1000 /tmp/apps-script-smoke 2>/dev/null || true
          echo
          if [ "$CODE" = "404" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "Apps Script deployment is not publicly reachable"
            exit 1
          fi
          if [ "$CODE" = "200" ] && ! grep -q '^smokeTest(' /tmp/apps-script-smoke; then
            echo "Apps Script returned HTTP 200 but not public JSONP"
            exit 1
          fi
          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
            echo "::warning::Apps Script smoke test timed out; code validation still passed"
          fi
