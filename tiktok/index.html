<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>NihilGuh — Player para TikTok</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
    /* Twitch requires an embed at least 400x300; narrow mobile screens crop the sides slightly. */
    #twitch-player { position: absolute; top: 50%; left: 50%; width: max(100vw, 400px); height: max(100vh, 300px); height: max(100dvh, 300px); transform: translate(-50%, -50%); }
    #twitch-player iframe { width: 100% !important; height: 100% !important; border: 0; display: block; }
    #recovery { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 24px); text-align: center; }
    #recovery[hidden] { display: none; }
    #resume { appearance: none; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 11px 18px; background: rgba(14, 9, 24, .94); color: #fff; font: 600 14px/1.2 inherit; font-size: 14px; cursor: pointer; box-shadow: 0 4px 24px rgba(0,0,0,.6); white-space: nowrap; }
    #resume:focus-visible { outline: 3px solid #e8bdff; outline-offset: 3px; }
    #notice { color: #fff; font-size: 13px; padding: 8px 12px; background: rgba(0,0,0,.88); border-radius: 10px; }
    #notice[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Transmissão da Twitch NihilGuh em tela inteira">
    <div id="twitch-player"></div>
    <div id="recovery" hidden>
      <button id="resume" type="button">▶ Iniciar live com som</button>
    </div>
    <div id="notice" role="alert" hidden></div>
  </main>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script src="./player.js"></script>
</body>
</html>
