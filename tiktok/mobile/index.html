<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="robots" content="noindex,nofollow">
  <title>NihilGuh — Twitch mobile recortada para TikTok</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
    /* O iframe ocupa uma viewport DESKTOP ampla, para que o video vertical
       ocupe cerca de 1080 pixels reais em uma fonte OBS 1080x1920. O painel
       de chat fica fisicamente fora do recorte: nao usamos transform:scale().
       O calculo do posicionamento e feito em crop.js. */
    #twitch-mobile {
      position: absolute;
      top: 0;
      left: 0;
      width: 4063px;
      height: 1920px;
      display: block;
      border: 0;
      background: #000;
    }
    #debug { position: fixed; left: 10px; bottom: 10px; z-index: 4;
      padding: 9px 12px; max-width: calc(100% - 20px);
      font: 13px/1.4 system-ui, sans-serif; color: #fff;
      background: rgba(15,15,15,.92); border: 1px solid #767676; border-radius: 8px; }
    #debug[hidden] { display: none; }
    #debug a { color: #d2b4ff; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Live vertical NihilGuh, com chat recortado">
    <iframe id="twitch-mobile"
      src="https://m.twitch.tv/nihilguh"
      title="NihilGuh — Twitch mobile"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      loading="eager"></iframe>
  </main>
  <aside id="debug" hidden aria-live="polite"></aside>
  <script src="./crop.js?v=1"></script>
</body>
</html>
