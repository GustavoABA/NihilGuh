<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>NihilGuh — Twitch Mobile (teste iframe)</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
    #frame-host{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;background:#000}
    #mobile-frame{display:block;flex:none;border:0;width:390px;height:100dvh;transform-origin:top center;background:#000}
    #help{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;gap:8px;align-items:center;background:#131313dd;border:1px solid #ffffff45;border-radius:12px;padding:8px 10px;font-size:12px;max-width:calc(100vw - 24px)}
    #help a{color:#d1b8ff;text-decoration:none;font-weight:700}
    #help[hidden]{display:none}
  </style>
</head>
<body>
  <main id="frame-host" aria-label="Twitch mobile em iframe">
    <iframe id="mobile-frame"
      title="NihilGuh na Twitch mobile"
      src="https://m.twitch.tv/nihilguh"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <nav id="help" aria-label="Opção de recuperação">
    <span>Se aparecer tela preta:</span>
    <a href="../">Usar player oficial</a>
    <a href="https://m.twitch.tv/nihilguh" target="_blank" rel="noopener noreferrer">Abrir mobile</a>
  </nav>
  <script>
    (() => {
      const frame = document.getElementById('mobile-frame');
      const help = document.getElementById('help');
      const params = new URLSearchParams(location.search);
      if (params.get('clean') === '1') help.hidden = true;

      // A largura do documento dentro do iframe é de 390 CSS px,
      // mesmo quando a fonte do OBS tem 1080 px de largura.
      const fitMobile = () => {
        const scale = innerWidth / 390;
        frame.style.height = (innerHeight / scale) + 'px';
        frame.style.transform = 'scale(' + scale + ')';
      };
      fitMobile();
      window.addEventListener('resize', fitMobile);

      document.addEventListener('keydown', (event) => {
        if (event.code === 'KeyF' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          } else if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }
        if (event.code === 'KeyH' && !event.repeat) help.hidden = !help.hidden;
      });
    })();
  </script>
</body>
</html>
